name: ForgeCI Dogfood

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: forgeci-dogfood-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Run ForgeCI on ForgeCI
        run: ./tools/integration/self_hosting.sh
        env:
          FORGECI_DIAGNOSTICS_DIR: \${{ runner.temp }}/forgeci-self-hosting-diagnostics
      - name: Upload safe diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: forgeci-dogfood-diagnostics
          path: \${{ runner.temp }}/forgeci-self-hosting-diagnostics
          if-no-files-found: ignore
          retention-days: 3
